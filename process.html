<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Hub | M1 AI Keyer</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
        .header { text-align: center; margin-bottom: 2rem; }
        .status-badge { background: #0284c7; color: white; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; display: inline-block; margin-top: 0.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
        .panel { background: #1e293b; padding: 1rem; border-radius: 8px; border: 1px solid #334155; }
        canvas { width: 100%; height: auto; background: #000; border-radius: 4px; display: block; }
        video { display: none; }
        .nav-menu { display: flex; justify-content: center; gap: 20px; padding: 1rem; margin-bottom: 2rem; background: #1e293b; border-radius: 8px; border: 1px solid #334155; max-width: 600px; margin-left: auto; margin-right: auto; }
        .nav-menu a { color: #f8fafc; text-decoration: none; font-weight: 500; font-size: 1.1rem; transition: color 0.2s; }
        .nav-menu a:hover { color: #38bdf8; }
    </style>
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        let videoElement, srcCanvas, alphaCanvas, sCtx, aCtx;
        let crop = { xmin: 0, xmax: 0, ymin: 0, ymax: 0 };

        window.addEventListener('DOMContentLoaded', async () => {
            const videoBlob = sessionStorage.getItem('activeVideoBlob');
            if (!videoBlob) {
                window.location.href = 'index.html';
                return;
            }

            videoElement = document.getElementById('videoSource');
            srcCanvas = document.getElementById('srcCanvas');
            alphaCanvas = document.getElementById('alphaCanvas');
            sCtx = srcCanvas.getContext('2d');
            aCtx = alphaCanvas.getContext('2d');

            videoElement.src = videoBlob;
            videoElement.onloadedmetadata = () => {
                videoElement.currentTime = 0.2; // Move frame forward to skip black introduction
            };

            videoElement.onseeked = () => {
                runAutoCropAnalysis();
                document.getElementById('status').innerText = "Crop limits applied. Initializing WebGPU Neural Engine...";
                startMattingPipeline();
            };
        });

        function runAutoCropAnalysis() {
            srcCanvas.width = videoElement.videoWidth;
            srcCanvas.height = videoElement.videoHeight;
            sCtx.drawImage(videoElement, 0, 0);

            const imgData = sCtx.getImageData(0, 0, videoElement.videoWidth, videoElement.videoHeight);
            const pixels = imgData.data;

            let minX = videoElement.videoWidth, maxX = 0, minY = videoElement.videoHeight, maxY = 0;

            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
                // Hue mask matching green screen bounds
                if (g > 70 && g > r * 1.25 && g > b * 1.25) {
                    const idx = i / 4;
                    const x = idx % videoElement.videoWidth;
                    const y = Math.floor(idx / videoElement.videoWidth);

                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }

            crop = {
                xmin: Math.max(0, minX - 15),
                xmax: Math.min(videoElement.videoWidth, maxX + 15),
                ymin: Math.max(0, minY - 15),
                ymax: Math.min(videoElement.videoHeight, maxY + 15)
            };

            // Overlay crop bounding box
            sCtx.strokeStyle = '#38bdf8';
            sCtx.lineWidth = 4;
            sCtx.strokeRect(crop.xmin, crop.ymin, crop.xmax - crop.xmin, crop.ymax - crop.ymin);
        }

        async function startMattingPipeline() {
            try {
                // Instantiates vision segmentation pipeline via M1 Metal WebGPU backend
                const segmenter = await pipeline('image-segmentation', 'Xenova/birefnet-general', { device: 'webgpu' });
                document.getElementById('status').innerText = "Processing Frames (WebGPU Active)";

                alphaCanvas.width = crop.xmax - crop.xmin;
                alphaCanvas.height = crop.ymax - crop.ymin;

                videoElement.play();

                async function renderFrame() {
                    if (videoElement.paused || videoElement.ended) return;

                    aCtx.drawImage(
                        videoElement,
                        crop.xmin, crop.ymin, alphaCanvas.width, alphaCanvas.height,
                        0, 0, alphaCanvas.width, alphaCanvas.height
                    );

                    const frameBlob = alphaCanvas.toDataURL('image/png');
                    const output = await segmenter(frameBlob);

                    if (output && output[0]) {
                        const maskCanvas = await output[0].mask.toCanvas();
                        aCtx.drawImage(maskCanvas, 0, 0, alphaCanvas.width, alphaCanvas.height);
                    }

                    requestAnimationFrame(renderFrame);
                }
                renderFrame();
            } catch (err) {
                document.getElementById('status').innerText = "WebGPU error. Ensure Chrome/Safari WebGPU flags are active.";
                console.error(err);
            }
        }
    </script>
</head>
<body>
    <div class="nav-menu">
        <a href="index.html">🏠 Home</a>
        <a href="process.html">⚙️ Processor</a>
        <a href="rationale.html">🧠 Rationale</a>
    </div>

    <div class="header">
        <h2>Local M1 WebGPU Execution Workspace</h2>
        <div class="status-badge" id="status">Analyzing Initial Frame...</div>
    </div>

    <div class="grid">
        <div class="panel">
            <h3>1. Auto-Crop Detection Area</h3>
            <canvas id="srcCanvas"></canvas>
        </div>
        <div class="panel">
            <h3>2. Local AI Alpha Matte Stream</h3>
            <canvas id="alphaCanvas"></canvas>
        </div>
    </div>
    <video id="videoSource" muted playsinline></video>
</body>
</html>
