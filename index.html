<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1 AI Keyer Studio</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; margin: 0; }
        .container { max-width: 550px; margin: 4rem auto; background: var(--card); padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 1.5rem; margin-top: 0; }
        p { color: #94a3b8; font-size: 0.95rem; }
        .file-drop { border: 2px dashed #475569; border-radius: 8px; padding: 2rem; text-align: center; margin: 1.5rem 0; background: #0f172a; }
        input[type="file"] { display: none; }
        label.upload-btn { background: #334155; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; display: inline-block; margin-top: 1rem; color: #fff; font-weight: 500; }
        label.upload-btn:hover { background: #475569; }
        .action-btn { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        .action-btn:hover { opacity: 0.9; }
        .nav-menu { display: flex; justify-content: center; gap: 20px; padding: 1rem; margin-bottom: 2rem; background: var(--card); border-radius: 8px; border: 1px solid #334155; max-width: 600px; margin-left: auto; margin-right: auto; }
        .nav-menu a { color: var(--text); text-decoration: none; font-weight: 500; font-size: 1.1rem; transition: color 0.2s; }
        .nav-menu a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="nav-menu">
        <a href="index.html">🏠 Home</a>
        <a href="process.html">⚙️ Processor</a>
        <a href="rationale.html">🧠 Rationale</a>
    </div>

    <div class="container">
        <h1>M1 Mac AI Green Screen Keyer</h1>
        <p>Pre-crop footage bounds and calculate AI alpha mattes 100% locally using Metal WebGPU.</p>
        
        <div class="file-drop">
            <span id="fileLabel">Select source footage clip (.mp4, .mov)</span><br>
            <label for="videoInput" class="upload-btn">Browse File</label>
            <input type="file" id="videoInput" accept="video/*" onchange="updateFileName()">
        </div>

        <button class="action-btn" onclick="launchProcessingHub()">Launch Processing Hub</button>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('videoInput');
            if (input.files[0]) {
                document.getElementById('fileLabel').innerText = input.files[0].name;
            }
        }

        function launchProcessingHub() {
            const input = document.getElementById('videoInput');
            if (!input.files[0]) {
                alert("Please select a video file first.");
                return;
            }
            const blobUrl = URL.createObjectURL(input.files[0]);
            sessionStorage.setItem('activeVideoBlob', blobUrl);
            window.location.href = 'process.html';
        }
    </script>
</body>
</html>
